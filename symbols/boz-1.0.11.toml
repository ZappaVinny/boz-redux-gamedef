# BOZ Redux symbol database. Edit in Ghidra and export (see docs/contributing.md),
# or by hand. Offsets are from the image base. Confidence: confirmed | likely.

[game]
version = "1.0.11"
version_code = 1045111
image_sha256 = "f458c15a7111779ad320af377d0bb751294119788ba06d430bee0cc977539fee"
image_base = 0x4a000000

# Mapping progress per subsystem (free text, kept by hand).
[coverage]
engine = "boundary report by import family (ExportBozEngineBoundary); asset pipeline mapped: Game_InitEngine picks blackops_<format>.dz, CIsArchiveManager (slots 2-10) mounts it through derbh (dzArchiveAttach), CIwResManager_LoadGroup builds [debug_patches/]<name>.group.bin, IwPath_Resolve tries data-<style>/ then the bare name, everything reaches s3eFileOpen; native assets: CIwTexture/CIwImage serialisation identifies raw format 0x05 (16-bit ARGB4444) and 0x0e (32-bit, bytes B G R A) plus a bit-packed cooked mip header followed at body +0x4f by platform ETC1 (archive marker 0x27) or DXT1 (0x34) blocks; CIwModelBlockVerts stores a center-biased component-planar int16 position array followed by unique-to-render vertex remaps; CIwModelBlockCols writes four component planes through descriptor 0x0104, or when its flag byte is 1 writes one grayscale byte per vertex and expands it at load to (v,v,v,255); each GL primitive block stores an explicit index into CIwModel's terminal CIwMaterial reference array; IwHashString"
runtime = "main loop (GameMain, CIwGame/CGame Init/Update/ShutDown), top-level game states (0 Ingame, 1 DOIngame, 2 FrontEnd, 3 Splash), CIsStateMachine events (1 Enter, 2 Exit, 4 message, 5 frame); class map with constructors/destructors from tools; console variables (13 Cvar_Register*, 597 cvars); frame pipeline mapped: CGame::Update -> CIwGame::Update -> BeginFrame (UpdateStates: state Update -> sub-state Update -> CIwWorld::Update) and slot 27 (state Render, sound, network, Director_Tick: component tables Update/Update2/Update3 + systems Update/LateUpdate, then PostUpdate); 65 singletons located (T::s_instance, BozNameSingletons); system and component-table slot meanings"
state = "rounds mapped: CWaveManager (struct, Update, OnEvent, StartWave) runs CWave definitions (slots 20-46 getters; CWaveRepeatable scales base * multiplier^(round - m_StartingWave)); round ends when killed >= GetZombieCount; score mapped: CScoreManager::AddScore, SUBJECT_ADD_SCORE / SUBJECT_CHARGE_POINTS / SUBJECT_POINTS_PENALTY, COD Points fallback, cvars UnlimitedScore and StartingScore; Dead Ops: CDORoundManager rounds from 42 CDORound resources (arena, lightmap, music, lighting), CDOZombieSpawner hordes (unlock round, spawn rates)"
entities = "component system mapped: CIsComponent slots (Init, GetTypeId, ...), 162 CIsComponentTable<T> globals (T::s_table) and 114 T::FromEntity lookups named by BozNameComponentTables; observer events (CIsSubject Subscribe/Notify/Dispatch, CIsObserver::OnEvent); reflection mapped (CIsClassInfo, AddBase, AddProperty): 369 classes, 929 named fields in sdk/reflection/boz-1.0.11.toml (ExportBozReflection), T::GetClassInfo and T::RegisterReflection named; event bus mapped: 337 SUBJECT_* events (ids = IwHashString of the name, SubjectId_Register) in sdk/events/boz-1.0.11.toml with sending and handling classes (BozNameHashGlobals, ExportBozEvents); purchases all send SUBJECT_CHARGE_POINTS to CScoreManager; pathing: Recast/Detour v7 navmeshes (CIsNavMesh = 128-byte Recast config + Detour tiles), CIsCrowdAgent crowd agents, CIsNavMeshConnection / CJumpConnection climbs"
weapons = "firing mapped: weapon behaviours are state machines (State_Firing takes ammo unless WeaponsUnlimitedAmmo; FinishReload moves reserve to clip); the shoot animation drives Weapon_FireBullets (spread, Physics_RayCast, SUBJECT_WEAPON_HIT to the target CIsBroadcaster); CWeaponManager SetWeapon / SetReloading / MeleeAttack / GiveWeapon; data layout from reflection"
rendering = "transform interpolation helpers known from the client"
ui = "Flash front end: CFlashMenuState CallActionScript / TransitionState (C++ -> ActionScript), menus answer with SUBJECT_* events; HUD via IwUI elements found by name (CUIPageManager::FindElement), CHUDManager::UpdateWeapon / SetScore"
audio = "sound specs are resources: CIwSoundSpecSound (sample data on s3eSound channels) and CIwSoundSpecAudio (streamed mp3 via s3eAudio, e.g. blackops-music/*.mp3); CIwSoundManager::Play(hash), CSoundSequenceManager::Play; spec slots 16-20"
saves = "fully decoded in bozkit/save.py: all .i3d files are u32 version + u32 Adler-32 checksum (field zeroed) + body; game save = level cstring, dynamic count, sections (owner, class, data; many sections are reflection blobs); settings = CSaveManager +0xf8 fields (sensitivity, volumes, brightness, ...); CSaveManager Serialise / Collect / GetSection"
network = "Marmalade IwNetwork with pluggable backends; configurations Bonjour_Tcp (local Wi-Fi: Bonjour/mDNS discovery _PROJECT_KIWI._tcp + TCP) and OnlineDemonware (DemonWare rooms + STUN), chosen by CIwNetworkConfigurationManager::SetConfiguration; all DemonWare use goes through IwDemonware::Get (rooms, login, telemetry, server time, key archive); host-authoritative (CGameNetwork isHost +0x54)"

