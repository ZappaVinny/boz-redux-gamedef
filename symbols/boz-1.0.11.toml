thumb = true
subsystem = "entities"
confidence = "confirmed"
notes = "Fixed-step player update (CIsComponentTable<CPlayerController>::FixedStep). Moves the player from +0x13c (move angle) and +0x140 (move amount), then turns: yaw += -(+0x148 look x) * TurnSpeed * (+0x144 look magnitude) * GetAimXSensitivity, pitch += (+0x14c look y) * PitchSpeed * (+0x144) * GetAimYSensitivity (Aim*/Sprint*/Perked* variants while aiming, sprinting or with Deadshot). Yaw at +0x170 and pitch at +0x174 are radians; pitch is clamped to +-MaxPitch; yaw over 2pi is reset to 0. The view rotation is only rebuilt when +0x15b (look allowed) and +0x154 (look input this frame) or tilt controls. Turn deltas also go to the weapon manager (+0x88) +0x104/+0x108 while its recoil flag +0xfa is set; recoil offsets come from its +0xfc/+0x100. Runs only while a Zombies match runs unpaused."

