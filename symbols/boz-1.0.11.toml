notes = "Applies a CIwMaterial to the GLES1 fixed-function pipeline. Flags at +0x10.\nStage 0 (GL_TEXTURE0): texture slot 0 combined GL_MODULATE with the primary colour (vertex colours); blend mode 4 of bits 22..24 instead replaces RGB with the primary colour.\nStage 1 (GL_TEXTURE1): texture slot 1 (baked lightmap atlas in shipped maps, sampled with CIwModelBlockGLUVs2). glTexEnvx GL_TEXTURE_ENV_MODE by bits 19..21: 0 GL_MODULATE, 1 GL_DECAL, 2 GL_ADD, 3 GL_REPLACE, 4 GL_BLEND, 5 GL_COMBINE with GL_RGB_SCALE 2.0, 6 GL_COMBINE with GL_RGB_SCALE 4.0 (default COMBINE_RGB = MODULATE). Without the combine extension 5/6 fall back to GL_BLEND.\nBlend by bits 16..18: 0/5 opaque; 1/4 SRC_ALPHA,ONE_MINUS_SRC_ALPHA; 2 SRC_ALPHA,ONE; 3 ZERO,ONE_MINUS_SRC_COLOR. Mode 5 with primary texture runtime flags(+0x34)&8 enables GL_ALPHA_TEST GREATER 0.75. Bits 25..28 select an explicit alpha function, reference byte material+0x17. Bit 2: GL_SMOOTH vs GL_FLAT. A dot3 path swaps the stages when normal mapping is active (FUN_4a2b519c).\nVerified from the GL calls in this function (glTexEnvx arguments read from the disassembly)."

